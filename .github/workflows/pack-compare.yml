name: Flash Next pack comparison

on:
  pull_request:
    paths:
      - 'tools/zig/pack_compare.py'
      - 'tools/zig/pack_compare_test.py'
      - '.github/workflows/pack-compare.yml'

permissions:
  contents: read

jobs:
  pack-compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Install the comparator dependency
        run: python -m pip install numpy==2.5.2
      - name: Reject truncated or inconsistent pack tensors
        run: python -m unittest discover -s tools/zig -p pack_compare_test.py
